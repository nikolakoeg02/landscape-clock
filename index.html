<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Landscape Notion Clock</title>

    <!-- Bodoni Moda -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

    <link
        href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400&display=swap"
        rel="stylesheet"
    >

    <style>

        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            padding: 0;

            width: 100%;
            height: 100%;

            background: transparent;

            display: flex;
            justify-content: center;
            align-items: center;
        }

        /* MAIN CLOCK */

        .clock {
            width: 100%;
            max-width: 1486px;

            height: 400px;
            max-height: 100%;

            background: #F5C0B9;

            border-radius: 45px;

            display: flex;
            justify-content: center;
            align-items: center;

            font-family:
                "Bodoni Moda",
                "Bodoni 72",
                Didot,
                "Times New Roman",
                serif;

            color: #F9DDD6;

            overflow: hidden;
        }

        /* TIME */

        .time {
            display: flex;
            align-items: center;
            justify-content: center;

            gap: 45px;
        }

        #hours,
        #minutes {
            font-size: clamp(70px, 15vw, 230px);

            font-weight: 400;

            line-height: 1;

            letter-spacing: -8px;
        }

        /* COLON */

        .colon {
            font-size: clamp(60px, 12vw, 190px);

            font-weight: 400;

            line-height: 1;

            margin-top: -15px;
        }

        /* SMALLER SCREENS */

        @media (max-width: 700px) {

            .clock {
                height: 220px;
                border-radius: 30px;
            }

            .time {
                gap: 18px;
            }

            #hours,
            #minutes {
                letter-spacing: -4px;
            }

            .colon {
                margin-top: -8px;
            }
        }

    </style>
</head>

<body>

    <div class="clock">

        <div class="time">

            <div id="hours">00</div>

            <div class="colon">:</div>

            <div id="minutes">00</div>

        </div>

    </div>


    <script>

        function updateClock() {

            const now = new Date();

            let hours = now.getHours();
            let minutes = now.getMinutes();

            // 24-hour format
            hours = String(hours).padStart(2, "0");
            minutes = String(minutes).padStart(2, "0");

            document.getElementById("hours").textContent = hours;
            document.getElementById("minutes").textContent = minutes;

        }

        // Show time immediately
        updateClock();

        // Keep clock live
        setInterval(updateClock, 1000);

    </script>

</body>
</html>
